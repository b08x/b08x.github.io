<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../../styles.css" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  body { margin: 0; padding: 22px; background: var(--background); }
  .wrap { display: grid; grid-template-columns: 220px 1fr; gap: 24px; }
  .rail { border: 1px solid var(--border); border-radius: var(--radius-md); padding: 8px 0; background: var(--surface); }
  .rail h4 { font-family: var(--font-ui); font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); padding: 4px 14px; margin: 4px 0; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
  const { Tabs, NavItem } = window.SyncopatedNotesDesignSystem_f2adea;
  function Demo() {
    const [tab, setTab] = React.useState("field");
    return (
      <div className="wrap">
        <div className="rail">
          <h4>On this page</h4>
          <NavItem active>Prompt Text</NavItem>
          <NavItem>SFL Metadata</NavItem>
          <NavItem depth={1}>Field</NavItem>
          <NavItem depth={1}>Tenor</NavItem>
          <NavItem depth={1}>Mode</NavItem>
          <NavItem>Example Output</NavItem>
        </div>
        <div>
          <Tabs value={tab} onChange={setTab} tabs={[
            {value:"field",label:"Field",count:4},
            {value:"tenor",label:"Tenor",count:3},
            {value:"mode",label:"Mode"},
          ]} />
          <p style={{fontFamily:'var(--font-body)',fontSize:14,color:'var(--text-2)',marginTop:16}}>
            Active tab: <b style={{color:'var(--accent)'}}>{tab}</b>
          </p>
        </div>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script>
</body>
</html>

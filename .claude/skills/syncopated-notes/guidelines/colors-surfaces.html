<!-- @dsCard group="Colors" viewport="700x180" name="Surfaces" subtitle="Warm paper stack — page → panel → code" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 20px; background: var(--background); }
  .row { display: flex; gap: 14px; flex-wrap: wrap; }
  .sw { width: 150px; border: 1px solid var(--border); border-radius: var(--radius-md); overflow: hidden; }
  .chip { height: 64px; }
  .meta { padding: 8px 10px; font-family: var(--font-ui); }
  .nm { font-size: 12px; font-weight: 700; color: var(--foreground); }
  .hx { font-size: 11px; color: var(--muted); margin-top: 2px; }
</style>
</head>
<body>
  <div class="row">
    <div class="sw"><div class="chip" style="background:var(--background)"></div><div class="meta"><div class="nm">background</div><div class="hx">#EDE6D6</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--surface)"></div><div class="meta"><div class="nm">surface</div><div class="hx">#E3DBC8</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--surface-2)"></div><div class="meta"><div class="nm">surface-2</div><div class="hx">#DACFB8</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--bg-code)"></div><div class="meta"><div class="nm">bg-code</div><div class="hx">#E3DBC8</div></div></div>
  </div>
</body>
</html>

<!-- @dsCard group="Spacing" viewport="700x180" name="Elevation" subtitle="Soft, neutral, rare — borders do the work" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 24px; background: var(--background); font-family: var(--font-ui); }
  .row { display: flex; gap: 22px; flex-wrap: wrap; }
  .u { text-align: center; }
  .box { width: 110px; height: 64px; background: var(--popover); border: 1px solid var(--border); border-radius: var(--radius-md); }
  .u b { display: block; font-size: 11px; color: var(--foreground); margin-top: 10px; }
</style>
</head>
<body>
  <div class="row">
    <div class="u"><div class="box" style="box-shadow:var(--shadow-xs)"></div><b>shadow-xs</b></div>
    <div class="u"><div class="box" style="box-shadow:var(--shadow-sm)"></div><b>shadow-sm</b></div>
    <div class="u"><div class="box" style="box-shadow:var(--shadow-md)"></div><b>shadow-md</b></div>
    <div class="u"><div class="box" style="box-shadow:var(--shadow-lg)"></div><b>shadow-lg</b></div>
  </div>
</body>
</html>

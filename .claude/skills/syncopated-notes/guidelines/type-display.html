<!-- @dsCard group="Type" viewport="700x230" name="Display & Headings" subtitle="Space Mono — the Field Note voice" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 22px; background: var(--background); }
  .stack > div { display: flex; align-items: baseline; gap: 16px; border-bottom: 1px solid var(--border); padding: 9px 0; }
  .stack > div:last-child { border-bottom: 0; }
  .t { font-family: var(--font-display); color: var(--accent); font-weight: 700; letter-spacing: -.01em; }
  .m { font-family: var(--font-ui); font-size: 11px; color: var(--muted); margin-left: auto; white-space: nowrap; }
</style>
</head>
<body>
  <div class="stack">
    <div><span class="t" style="font-size:38px">Routing tasks</span><span class="m">h1 · 38 / 700</span></div>
    <div><span class="t" style="font-size:30px">Capability fabric</span><span class="m">h2 · 30 / 700</span></div>
    <div><span class="t" style="font-size:24px">Shared context bus</span><span class="m">h3 · 24 / 700</span></div>
    <div><span class="t" style="font-size:20px;font-weight:600">Planner orchestration</span><span class="m">h4 · 20 / 600</span></div>
  </div>
</body>
</html>

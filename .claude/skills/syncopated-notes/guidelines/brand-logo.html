<!-- @dsCard group="Brand" viewport="700x230" name="Logo & Mark" subtitle="Plum node-mark + lowercase wordmark" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 26px; background: var(--background); font-family: var(--font-ui); }
  .grid { display: flex; gap: 26px; align-items: center; flex-wrap: wrap; }
  .tile { display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .tile img { display: block; }
  .cap { font-size: 11px; color: var(--muted); }
  .wm { font-family: var(--font-display); font-weight: 700; font-size: 22px; color: var(--cyan); letter-spacing: -.01em; }
  .onmark { background: var(--brand-mark); padding: 14px; border-radius: var(--radius-md); }
</style>
</head>
<body>
  <div class="grid">
    <div class="tile"><img src="../assets/brand/icon.svg" width="84" height="84" alt="icon" /><span class="cap">icon · 84px</span></div>
    <div class="tile"><div class="onmark"><img src="../assets/brand/icon.svg" width="56" height="56" alt="icon on plum" style="filter:brightness(10)" /></div><span class="cap">node motif</span></div>
    <div class="tile"><img src="../assets/brand/logo.svg" width="180" alt="logo" /><span class="cap">logo lockup · #8B0A5F</span></div>
    <div class="tile"><span class="wm">syncopated notes</span><span class="cap">wordmark · dusty blue, lowercase</span></div>
  </div>
</body>
</html>

<!-- @dsCard group="Type" viewport="700x150" name="Type Scale" subtitle="2xs → 5xl ramp" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 20px; background: var(--background); font-family: var(--font-display); color: var(--foreground); }
  .ramp { display: flex; align-items: baseline; gap: 18px; flex-wrap: wrap; }
  .ramp span { color: var(--foreground); line-height: 1; }
  .ramp i { font-family: var(--font-ui); font-style: normal; font-size: 10px; color: var(--muted); display:block; margin-top:4px; text-align:center; }
  .u { text-align: center; }
</style>
</head>
<body>
  <div class="ramp">
    <div class="u"><span style="font-size:11px">Aa</span><i>2xs 11</i></div>
    <div class="u"><span style="font-size:13px">Aa</span><i>sm 13</i></div>
    <div class="u"><span style="font-size:15px">Aa</span><i>base 15</i></div>
    <div class="u"><span style="font-size:20px">Aa</span><i>lg 20</i></div>
    <div class="u"><span style="font-size:24px">Aa</span><i>xl 24</i></div>
    <div class="u"><span style="font-size:30px">Aa</span><i>2xl 30</i></div>
    <div class="u"><span style="font-size:38px">Aa</span><i>3xl 38</i></div>
    <div class="u"><span style="font-size:48px">Aa</span><i>4xl 48</i></div>
  </div>
</body>
</html>

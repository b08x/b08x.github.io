<!-- @dsCard group="Type" viewport="700x200" name="Mono, Code & Meta" subtitle="Tokens, terminals, eyebrows" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 22px; background: var(--background); font-family: var(--font-ui); }
  .eyebrow { display:block; margin-bottom: 12px; }
  .term { background: var(--bg-code); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 12px 14px; font-family: var(--font-code); font-size: 13px; line-height: 1.7; color: var(--foreground); }
  .term .p { color: var(--chart-3); }
  .term .c { color: var(--muted); }
  .meta { margin-top: 14px; font-family: var(--font-ui); font-size: 12px; color: var(--muted); letter-spacing: .02em; }
</style>
</head>
<body>
  <span class="eyebrow">RECENT NOTES · UPDATED 2026-02-02</span>
  <div class="term"><span class="p">~/notes $</span> sync pull --tag agentic <span class="c"># 14 observations</span><br><span class="c">→ the-leak.md · ospf-as-planner.md · context-bus.md</span></div>
  <div class="meta">Last modified: 2026-02-02 06:37:57 PM · natural-language-processing · prompt-engineering</div>
</body>
</html>

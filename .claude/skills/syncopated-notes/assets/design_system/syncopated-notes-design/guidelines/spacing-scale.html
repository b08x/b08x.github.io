<!-- @dsCard group="Spacing" viewport="700x170" name="Spacing Scale" subtitle="8px rhythm with a 4px sub-step" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 20px; background: var(--background); font-family: var(--font-ui); }
  .row { display: flex; align-items: flex-end; gap: 14px; }
  .u { text-align: center; }
  .bar { background: var(--accent); border-radius: 2px; width: 26px; }
  .u b { display: block; font-size: 11px; color: var(--foreground); margin-top: 6px; }
  .u i { font-style: normal; font-size: 10px; color: var(--muted); }
</style>
</head>
<body>
  <div class="row">
    <div class="u"><div class="bar" style="height:4px"></div><b>1</b><i>4px</i></div>
    <div class="u"><div class="bar" style="height:8px"></div><b>2</b><i>8px</i></div>
    <div class="u"><div class="bar" style="height:12px"></div><b>3</b><i>12px</i></div>
    <div class="u"><div class="bar" style="height:16px"></div><b>4</b><i>16px</i></div>
    <div class="u"><div class="bar" style="height:24px"></div><b>5</b><i>24px</i></div>
    <div class="u"><div class="bar" style="height:32px"></div><b>6</b><i>32px</i></div>
    <div class="u"><div class="bar" style="height:48px"></div><b>8</b><i>48px</i></div>
    <div class="u"><div class="bar" style="height:64px"></div><b>10</b><i>64px</i></div>
  </div>
</body>
</html>

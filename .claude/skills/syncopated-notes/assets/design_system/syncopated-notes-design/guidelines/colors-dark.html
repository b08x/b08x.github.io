<!-- @dsCard group="Colors" viewport="700x150" name="Night / Warm Theme" subtitle="The .dark lamp-lit field note" -->
<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 20px; background: var(--background); font-family: var(--font-ui); }
  .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: stretch; }
  .sw { width: 120px; border: 1px solid var(--border); border-radius: var(--radius-sm); overflow: hidden; }
  .chip { height: 44px; }
  .meta { padding: 6px 9px; }
  .nm { font-size: 11.5px; font-weight: 700; color: var(--foreground); }
  .hx { font-size: 10.5px; color: var(--muted); margin-top: 2px; }
</style>
</head>
<body>
  <div class="row">
    <div class="sw"><div class="chip" style="background:var(--background)"></div><div class="meta"><div class="nm">background</div><div class="hx">#211C17</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--surface)"></div><div class="meta"><div class="nm">surface</div><div class="hx">#2A241D</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--accent)"></div><div class="meta"><div class="nm">accent</div><div class="hx">#C97A5E</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--cyan)"></div><div class="meta"><div class="nm">cyan</div><div class="hx">#84A4C0</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--foreground)"></div><div class="meta"><div class="nm">foreground</div><div class="hx">#ECE3D2</div></div></div>
  </div>
</body>
</html>

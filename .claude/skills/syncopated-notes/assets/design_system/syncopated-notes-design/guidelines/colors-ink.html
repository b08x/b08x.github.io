<!-- @dsCard group="Colors" viewport="700x160" name="Ink & Text" subtitle="Foreground hierarchy on paper" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 20px; background: var(--background); font-family: var(--font-ui); }
  .row { display: flex; gap: 28px; flex-wrap: wrap; align-items: flex-end; }
  .col span { display: block; }
  .s { font-size: 22px; font-weight: 700; }
  .l { font-size: 11px; color: var(--muted); margin-top: 6px; }
</style>
</head>
<body>
  <div class="row">
    <div class="col"><span class="s" style="color:var(--foreground)">Aa foreground</span><span class="l">#2A2420 · primary</span></div>
    <div class="col"><span class="s" style="color:var(--text-2)">Aa text-2</span><span class="l">#5C5248 · secondary</span></div>
    <div class="col"><span class="s" style="color:var(--muted)">Aa muted</span><span class="l">#8A7F72 · meta</span></div>
    <div class="col"><span class="s" style="color:var(--dim)">Aa dim</span><span class="l">#B0A492 · disabled</span></div>
  </div>
</body>
</html>

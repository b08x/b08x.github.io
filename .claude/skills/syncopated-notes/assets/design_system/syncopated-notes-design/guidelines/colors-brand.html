<!-- @dsCard group="Colors" viewport="700x180" name="Brand Accents" subtitle="Terracotta primary · dusty-blue secondary" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 20px; background: var(--background); }
  .row { display: flex; gap: 14px; flex-wrap: wrap; }
  .sw { width: 150px; border: 1px solid var(--border); border-radius: var(--radius-md); overflow: hidden; }
  .chip { height: 64px; }
  .meta { padding: 8px 10px; font-family: var(--font-ui); }
  .nm { font-size: 12px; font-weight: 700; color: var(--foreground); }
  .hx { font-size: 11px; color: var(--muted); margin-top: 2px; }
</style>
</head>
<body>
  <div class="row">
    <div class="sw"><div class="chip" style="background:var(--accent)"></div><div class="meta"><div class="nm">accent · terracotta</div><div class="hx">#B5654A</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--accent-hi)"></div><div class="meta"><div class="nm">accent-hi</div><div class="hx">#C97A5E</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--cyan)"></div><div class="meta"><div class="nm">blue · 2nd</div><div class="hx">#5C7C99</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--accent-soft)"></div><div class="meta"><div class="nm">accent-soft</div><div class="hx">#E7D7C6</div></div></div>
  </div>
</body>
</html>

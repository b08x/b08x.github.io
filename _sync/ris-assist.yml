# Sync manifest — RIS Assist docs
#
# Source of truth is the plugin repo. Pages listed here are COPIED into
# _docs/ris-assist/ by _sync/sync_docs.rb and must not be hand-edited; edit
# the source file in the plugin repo and re-run the sync.
#
# Guide pages are authored directly in _docs/ris-assist/ and are absent from
# this manifest on purpose — they have no upstream source.

repo_root: "../ris-assist"
doc_set: ris-assist
output_dir: _docs/ris-assist

# Links to repo files that aren't published here fall back to this base
# rather than becoming dead relative .md links.
github_blob_base: "https://github.com/b08x/ris_assist/blob/main"

pages:


<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
.mw{border-radius:var(--border-radius-lg);border:0.5px solid var(--color-border-tertiary);overflow:hidden}
.mh{padding:11px 16px;border-bottom:0.5px solid var(--color-border-tertiary);display:flex;align-items:center;justify-content:space-between;background:#0F0E0C}
.mt{font-family:'IBM Plex Mono',monospace;font-size:10px;color:#3A3530;letter-spacing:.03em}
.pt{font-family:'IBM Plex Mono',monospace;font-size:10px;color:#C8962E;letter-spacing:.07em;text-transform:uppercase}
canvas{display:block}
.mc{padding:10px 16px;border-top:0.5px solid var(--color-border-tertiary);display:flex;gap:8px;align-items:center;background:#0F0E0C}
.be{font-family:'IBM Plex Mono',monospace;font-size:10px;padding:6px 14px;background:transparent;border:1px solid #C8962E;color:#C8962E;border-radius:4px;cursor:pointer;letter-spacing:.05em;text-transform:uppercase;transition:background .15s}
.be:hover{background:rgba(200,150,46,.1)}
.be:disabled{opacity:.35;cursor:default}
.br{font-family:'IBM Plex Mono',monospace;font-size:10px;padding:6px 14px;background:transparent;border:1px solid #2A2520;color:#4A4440;border-radius:4px;cursor:pointer;transition:all .15s}
.br:hover{color:#8A8480;border-color:#3A3530}
.st{font-family:'IBM Plex Mono',monospace;font-size:10px;color:#2A2520;margin-left:auto;letter-spacing:.03em}
</style>
<h2 class="sr-only">HindsightAI latent manifold visualization — interactive animation showing conversational wreckage clustering into semantic segments via UMAP and HDBSCAN</h2>
<div class="mw">
  <div class="mh">
    <span class="mt">hindsightai · latent manifold · 2d projection</span>
    <span class="pt" id="phase-lbl">void · unexcavated</span>
  </div>
  <canvas id="mc" style="width:100%;display:block;"></canvas>
  <div class="mc">
    <button class="be" id="btn-run" onclick="runExcavation()">run excavation →</button>
    <button class="br" onclick="resetManifold()">reset</button>
    <span class="st" id="stat-lbl">n=77 embeddings · unstructured</span>
  </div>
</div>
<script>
const canvas=document.getElementById('mc');
const ctx=canvas.getContext('2d');
canvas.width=660;canvas.height=400;
const W=canvas.width,H=canvas.height;

const CLUSTERS=[
  {id:0,label:'regret vectors',cx:148,cy:196,col:'#BA7517',rx:66,ry:54},
  {id:1,label:'intent fragments',cx:374,cy:118,col:'#7F77DD',rx:70,ry:50},
  {id:2,label:'contextual noise',cx:508,cy:268,col:'#1D9E75',rx:60,ry:56},
  {id:3,label:'ambiguous utterances',cx:268,cy:318,col:'#D85A30',rx:66,ry:48},
  {id:4,label:'obvious statements',cx:556,cy:148,col:'#639922',rx:46,ry:42},
];

let pts=[],state='idle',animStart=null,haloA=0,labelA=0;
const UMAP_DUR=2000,HDBSCAN_DUR=900;

function rng(s){let x=s;return()=>{x=Math.imul(x^x>>>13,x|7345);x^=x<<17;x^=x>>>5;return(x>>>0)/4294967296};}

function genPoints(){
  pts=[];
  const r=rng(42);
  const counts=[15,18,13,12,8];
  CLUSTERS.forEach((c,ci)=>{
    for(let i=0;i<counts[ci];i++){
      const a=r()*6.2832,d=r()*33+5;
      pts.push({sx:60+r()*(W-120),sy:36+r()*(H-72),tx:c.cx+d*Math.cos(a),ty:c.cy+d*Math.sin(a),ci,col:c.col,pr:2+r()*1.4});
    }
  });
  for(let i=0;i<11;i++){
    const sx=60+r()*(W-120),sy=36+r()*(H-72);
    pts.push({sx,sy,tx:60+r()*(W-120),ty:36+r()*(H-72),ci:-1,col:'#2A2520',pr:1.4});
  }
}

function ease(t){return t<.5?2*t*t:-1+(4-2*t)*t;}

function hexToRgb(h){return[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];}

function drawGrid(){
  ctx.strokeStyle='rgba(200,150,46,0.03)';ctx.lineWidth=0.5;
  for(let x=0;x<W;x+=40){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
  for(let y=0;y<H;y+=40){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
}

function drawHalos(a){
  if(a<=0)return;
  CLUSTERS.forEach(c=>{
    ctx.save();
    ctx.globalAlpha=a*.7;
    ctx.translate(c.cx,c.cy);
    const [r,g,b]=hexToRgb(c.col);
    ctx.beginPath();ctx.ellipse(0,0,c.rx,c.ry,0,0,6.2832);
    ctx.fillStyle=`rgba(${r},${g},${b},0.07)`;ctx.fill();
    ctx.strokeStyle=c.col;ctx.lineWidth=0.8;ctx.setLineDash([3,5]);ctx.globalAlpha=a*.9;
    ctx.stroke();ctx.restore();
  });
}

function drawLabels(a){
  if(a<=0)return;
  ctx.save();
  ctx.font='10px "IBM Plex Mono",monospace';ctx.textAlign='center';
  CLUSTERS.forEach(c=>{
    ctx.globalAlpha=a;ctx.fillStyle=c.col;
    ctx.fillText('[ '+c.label+' ]',c.cx,c.cy-c.ry-9);
  });
  ctx.globalAlpha=a*.6;ctx.fillStyle='#3A3530';
  ctx.fillText('[ noise · n=11 ]',490,376);
  ctx.restore();
}

function draw(t){
  ctx.fillStyle='#0F0E0C';ctx.fillRect(0,0,W,H);
  drawGrid();drawHalos(haloA);
  const e=ease(Math.min(t,1));
  const gr=[58,53,48];
  pts.forEach(p=>{
    const x=p.sx+(p.tx-p.sx)*e,y=p.sy+(p.ty-p.sy)*e;
    ctx.save();ctx.globalAlpha=.35+.65*e;
    if(p.ci>=0){
      const [r2,g2,b2]=hexToRgb(p.col);
      const ro=Math.round(gr[0]+(r2-gr[0])*e),go=Math.round(gr[1]+(g2-gr[1])*e),bo=Math.round(gr[2]+(b2-gr[2])*e);
      ctx.fillStyle=`rgb(${ro},${go},${bo})`;
    }else{ctx.fillStyle='#2A2520';}
    ctx.beginPath();ctx.arc(x,y,p.pr,0,6.2832);ctx.fill();ctx.restore();
  });
  drawLabels(labelA);
}

function anim(ts){
  if(!animStart)animStart=ts;
  const el=ts-animStart;
  if(state==='animating'){
    const t=Math.min(el/UMAP_DUR,1);draw(t);
    if(t>=1){state='hdbscan';animStart=ts;}
    else requestAnimationFrame(anim);
  }else if(state==='hdbscan'){
    haloA=Math.min(el/HDBSCAN_DUR,1);
    labelA=Math.max(0,Math.min((el-400)/600,1));
    draw(1);
    if(el>=HDBSCAN_DUR+600){
      state='done';
      document.getElementById('phase-lbl').textContent='hdbscan · property lines drawn';
      document.getElementById('stat-lbl').textContent='n=66 clustered · n=11 noise · ε=0.42 · silhouette=0.67';
    }else requestAnimationFrame(anim);
  }
}

function runExcavation(){
  if(state!=='idle')return;
  state='animating';animStart=null;haloA=0;labelA=0;
  document.getElementById('phase-lbl').textContent='umap · excavating manifold...';
  document.getElementById('stat-lbl').textContent='computing dimensionality reduction...';
  document.getElementById('btn-run').disabled=true;
  requestAnimationFrame(anim);
}

function resetManifold(){
  state='idle';animStart=null;haloA=0;labelA=0;
  genPoints();draw(0);
  document.getElementById('phase-lbl').textContent='void · unexcavated';
  document.getElementById('stat-lbl').textContent='n=77 embeddings · unstructured';
  document.getElementById('btn-run').disabled=false;
}

genPoints();draw(0);
</script>

# _data/projects.yml
# Canonical registry of projects, tooling, experiments, and games.
# 
# Attributes:
# - title: Name of the project
# - description: Brief summary of features and value proposition
# - url: Destination link (relative path for internal, https:// for external)
# - external: true if hosted externally (e.g. GitHub repo), false if internal site page
# - badge: Primary descriptor or category pill
# - badge_class: CSS class for badge styling (badge-blue, badge-green, badge-red, badge-neutral)
# - year: Release or project year
# - tags: Array of keyword tags
# - card: true to feature on the landing page (index.md / home layout), false to display only on /projects/
# - archived: true to file the entry under "Past projects" on /projects/ instead of
#   "Active projects". Omit (or false) for current work — the Past section only
#   renders once at least one entry sets it.
# - repo: Repository web URL (https://) — adds a "repo ↗" link on the /projects/ row.
#   Project pages (layout: project) also derive a repo link from their first external
#   `links:` entry, so `repo:` here is for registry rows that point at an internal page.
# - fork_of: {name: "owner/repo", url: "https://github.com/..."} — marks the entry as a
#   fork of an external repository; renders the fork badge and upstream link on the
#   project page, the /projects/ row and the home card. Omit for standalone work.


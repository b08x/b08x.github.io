# Sidebar definitions for the _docs collection, keyed by `doc_set` in each
# page's frontmatter. One key per documented project.

gitagent-workbench:
  title: GitAgent Workbench
  subtitle: alpha
  # No `project_url`: this doc set is the project's page on the site, and
  # _data/projects.yml points its card straight here. Add one if a dedicated
  # /projects/ page ever lands — the breadcrumb picks it up automatically.
  edit_base: "https://github.com/b08x/gitagent-workbench/edit/main/"
  description: "Visual development environment for building production-ready AI agents: a guided wizard for identity, capabilities, models, compliance, and deployment structure that exports a complete agent package."

  groups:
    - title: Guide
      items:
        - title: Getting started
          url: /docs/gitagent-workbench/
        - title: Agent design patterns
          url: /docs/gitagent-workbench/agent-patterns/
        - title: Custom tools
          url: /docs/gitagent-workbench/custom-tools/

    - title: Reference
      items:
        - title: Architecture overview
          url: /docs/gitagent-workbench/architecture/
        - title: API reference
          url: /docs/gitagent-workbench/api-reference/
        - title: Troubleshooting
          url: /docs/gitagent-workbench/troubleshooting/

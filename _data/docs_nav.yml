# Sidebar definitions for the _docs collection, keyed by `doc_set` in each
# page's frontmatter. One key per documented project.

ris-assist:
  title: RIS Assist
  subtitle: pre-alpha
  project_url: /ris-assist/
  edit_base: "https://github.com/b08x/ris_assist/edit/main/"

  # Palette lifted from /ris-assist/persona-card.html — the project's own
  # identity rather than the site's Field Note theme. Keys are the site's
  # existing token names, so every shared component (post-content, badges,
  # rouge, tables) re-skins without touching its CSS.
  theme:
    bg: "#14101A"
    bg2: "#1B1230"
    surface: "#241838"
    border: "#35234A"
    border2: "#4A2E63"
    text: "#E8DFF5"
    text2: "#C3B2DC"
    muted: "#A895C4"
    dim: "#9A86B8"
    amber: "#C46BEB"
    amber-hi: "#E0A0F5"
    red: "#E8636B"
    badge-blue: "#7FA8D9"
    badge-green: "#A9E08A"
    badge-red: "#E8636B"
    badge-neutral: "#9A86B8"
    badge-text: "#14101A"
    # Uppercase labels and section markers — amber, as on the persona card.
    label: "#E8A13D"
    glow: "rgba(163,43,214,.18)"
  groups:
    - title: Guide
      items:
        - title: What is RIS Assist
          url: /docs/ris-assist/
        - title: Installing
          url: /docs/ris-assist/installing/
        - title: Site profile setup
          url: /docs/ris-assist/site-profile/
        - title: Commands
          url: /docs/ris-assist/commands/
        - title: Status and roadmap
          url: /docs/ris-assist/roadmap/

    - title: Domain explainers
      items:
        - title: Order lifecycle
          url: /docs/ris-assist/order-lifecycle/
        - title: Accession vs. order number
          url: /docs/ris-assist/accession-vs-order-number/
        - title: Modality worklist
          url: /docs/ris-assist/modality-worklist/
        - title: Report status flow
          url: /docs/ris-assist/report-status-flow/
        - title: Topology patterns
          url: /docs/ris-assist/topology-patterns/

    - title: Reference
      items:
        - title: Analyst persona
          url: /docs/ris-assist/persona-spec/
        - title: Guardrails
          url: /docs/ris-assist/guardrails/
        - title: Non-goals

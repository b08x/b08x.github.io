---
layout: notes
body_class: prompts-bench
---

<style>
  /* The permalink page carries the same bench, so the only extra chrome is
     the way back into the library and whatever prose the prompt's own
     markdown body adds beneath it. */
  .prompt-return {
    display: inline-flex;
    align-items: center;
    gap: var(--space-2);
    margin-bottom: var(--space-5);
    padding: var(--space-2) var(--space-3);
    border: var(--border-width) solid var(--border);
    border-radius: var(--radius-pill);
    background: var(--surface);
    color: var(--muted);
    font-family: var(--font-ui);
    font-size: var(--text-2xs);
    letter-spacing: var(--tracking-wide);
    text-decoration: none;
    transition: color var(--transition-fast), border-color var(--transition-fast);
  }
  .prompt-return:hover { color: var(--foreground); border-color: var(--accent); }

  .prompt-notes {
    margin-top: var(--space-8);
    padding-top: var(--space-5);
    border-top: var(--border-width) solid var(--border);
    max-width: var(--measure-prose);
  }
</style>

<a href="{{ '/projects/prompt-library/' | relative_url }}" class="prompt-return">&larr; back to prompts</a>

<script type="application/json" id="prompts-data">
[
  {
    "title": {{ page.title | jsonify }},
    "tag": {{ page.tag | jsonify }},
    "category": {{ page.category | jsonify }},
    "instructions": {{ page.instructions | jsonify }},
    "example": {{ page.example | jsonify }},
    "sfl": {{ page.sfl | jsonify }},
    "url": {{ page.url | relative_url | jsonify }}
  }
]
</script>

{% include prompt-bench.html mode="single" %}

{% if content != "" %}
<div class="prompt-notes post-content">
  {{ content }}
</div>
{% endif %}

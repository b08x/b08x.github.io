<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title }}</title>
  <meta name="description" content="{{ page.description }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,600;1,9..144,300;1,9..144,400;1,9..144,600&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:      #F4EFE6;
      --bg2:     #EDE7DC;
      --border:  #D4CABF;
      --text:    #1C1814;
      --text2:   #6B5A4E;
      --muted:   #9A8A7E;
      --dim:     #B8A898;
      --accent:  #7D5A1E;
      --accent2: #A07030;
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'Fraunces', serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      font-optical-sizing: auto;
    }

    a { color: inherit; text-decoration: none; }

    /* ── Layout ── */
    .container {
      max-width: 660px;
      margin: 0 auto;
      padding: 52px 32px 80px;
    }

    /* ── Header ── */
    header {
      margin-bottom: 56px;
    }

    .site-name {
      font-size: 26px;
      font-weight: 600;
      letter-spacing: -.02em;
      line-height: 1;
      margin-bottom: 8px;
    }

    .site-name a:hover { color: var(--accent); transition: color .15s; }

    .site-meta {
      font-family: 'DM Mono', monospace;
      font-size: 10.5px;
      color: var(--muted);
      letter-spacing: .03em;
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    .site-meta a {
      color: var(--muted);
      transition: color .15s;
    }

    .site-meta a:hover { color: var(--accent); }

    .sep {
      opacity: .4;
      font-size: 9px;
    }

    /* ── Notes list ── */
    .notes {
      display: flex;
      flex-direction: column;
    }

    .note {
      padding: 28px 0;
      border-top: 1px solid var(--border);
      position: relative;
    }

    .note:last-child {
      border-bottom: 1px solid var(--border);
    }

    /* syncopated indent — some entries offset */
    .note.offset {
      padding-left: 20px;
    }

    .note-tag {
      font-family: 'DM Mono', monospace;
      font-size: 10px;
      letter-spacing: .07em;
      text-transform: uppercase;
      margin-bottom: 9px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .tag-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      display: inline-block;
      flex-shrink: 0;
    }

    .tag-project  .tag-dot { background: #7A3020; }
    .tag-research .tag-dot { background: #1A4A3A; }
    .tag-note     .tag-dot { background: #3A3A6A; }
    .tag-draft    .tag-dot { background: var(--dim); }

    .tag-project  { color: #7A3020; }
    .tag-research { color: #1A4A3A; }
    .tag-note     { color: #3A3A6A; }
    .tag-draft    { color: var(--muted); }

    .note-title {
      font-size: 22px;
      font-weight: 600;
      letter-spacing: -.015em;
      line-height: 1.2;
      margin-bottom: 8px;
    }

    .note-title a:hover {
      color: var(--accent);
      transition: color .15s;
    }

    .note-title.stub {
      color: var(--dim);
      font-style: italic;
      font-weight: 300;
    }

    .note-desc {
      font-size: 15px;
      font-style: italic;
      color: var(--text2);
      line-height: 1.6;
      margin-bottom: 12px;
      font-weight: 300;
    }

    .note-meta {
      font-family: 'DM Mono', monospace;
      font-size: 10px;
      color: var(--muted);
      letter-spacing: .03em;
      display: flex;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
    }

    .note-meta a {
      color: var(--accent);
      transition: color .15s;
    }

    .note-meta a:hover { color: var(--accent2); }

    .note-meta .arrow { font-size: 11px; }

    /* stub state */
    .note.stub-entry {
      opacity: .45;
    }

    .note.stub-entry:hover {
      opacity: .65;
      transition: opacity .2s;
    }

    /* ── Section label ── */
    .section-label {
      font-family: 'DM Mono', monospace;
      font-size: 10px;
      color: var(--dim);
      letter-spacing: .1em;
      text-transform: uppercase;
      margin-bottom: 4px;
      margin-top: 48px;
    }

    .section-label:first-child { margin-top: 0; }

    /* ── Footer ── */
    footer {
      margin-top: 64px;
      padding-top: 20px;
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
    }

    .footer-text {
      font-family: 'DM Mono', monospace;
      font-size: 10px;
      color: var(--dim);
      letter-spacing: .03em;
    }

    .footer-text a {
      color: var(--muted);
      transition: color .15s;
    }

    .footer-text a:hover { color: var(--accent); }

    /* ── Rhythm mark ── */
    .rhythm {
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      color: var(--dim);
      letter-spacing: .2em;
      margin-bottom: 48px;
      user-select: none;
    }

    /* ── Responsive ── */
    @media (max-width: 600px) {
      .container { padding: 36px 20px 60px; }
      .note.offset { padding-left: 0; }
    }
  </style>
</head>
<body>
  <div class="container">
{{ content }}
  </div>
</body>
</html>

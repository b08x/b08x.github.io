---
layout: default
---

<style>
  a { color: inherit; text-decoration: none; }

  /* ── Layout ── */
  .container {
    max-width: 1040px;
    margin: 0 auto;
    padding: 52px 32px 80px;
  }

  /* ── Header ── */
  header {
    margin-bottom: 56px;
    text-align: center;
  }

  .site-name {
    font-size: 26px;
    font-weight: 600;
    letter-spacing: -.02em;
    line-height: 1;
    margin-bottom: 8px;
  }

  .site-name a:hover { color: var(--amber); transition: color .15s; }

  .site-meta {
    font-family: 'Space Mono', monospace;
    font-size: 10.5px;
    color: var(--muted);
    letter-spacing: .03em;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 16px;
    flex-wrap: wrap;
  }

  .site-meta a {
    color: var(--muted);
    transition: color .15s;
  }

  .site-meta a:hover { color: var(--amber); }

  .sep {
    opacity: .4;
    font-size: 9px;
  }

  /* ── Footer ── */
  footer {
    margin-top: 64px;
    padding-top: 20px;
    border-top: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-wrap: wrap;
    gap: 16px;
    text-align: center;
  }

  .footer-text {
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    color: var(--dim);
    letter-spacing: .03em;
  }

  .footer-text a {
    color: var(--muted);
    transition: color .15s;
  }

  .footer-text a:hover { color: var(--amber); }

  /* ── Two-column responsive grid ── */
  .grid-2 {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 20px;
    margin-bottom: 16px;
  }

  /* ── Card (notes & post entries) ── */
  .card {
    padding: 24px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--bg2);
    position: relative;
  }

  .card .badge-row {
    margin-bottom: 9px;
  }

  .note-title {
    font-size: 22px;
    font-weight: 600;
    letter-spacing: -.015em;
    line-height: 1.2;
    margin-bottom: 8px;
  }

  .note-title a:hover {
    color: var(--amber);
    transition: color .15s;
  }

  .note-title.stub {
    color: var(--dim);
    font-style: italic;
    font-weight: 300;
  }

  .note-desc {
    font-size: 15px;
    font-style: italic;
    color: var(--text2);
    line-height: 1.6;
    margin-bottom: 12px;
    font-weight: 300;
  }

  .note-meta {
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    color: var(--muted);
    letter-spacing: .03em;
    display: flex;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
  }

  .note-meta a {
    color: var(--amber);
    transition: color .15s;
  }

  .note-meta a:hover { color: var(--amber-hi); }

  .note-meta .arrow { font-size: 11px; }

  /* stub state */
  .note.stub-entry {
    opacity: .45;
  }

  .note.stub-entry:hover {
    opacity: .65;
    transition: opacity .2s;
  }

  /* ── Section label ── */
  .section-label {
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    color: var(--dim);
    letter-spacing: .1em;
    text-transform: uppercase;
    margin-bottom: 4px;
    margin-top: 48px;
  }

  .section-label:first-child { margin-top: 0; }

  /* ── Rhythm mark ── */
  .rhythm {
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    color: var(--dim);
    letter-spacing: .2em;
    margin-bottom: 48px;
    user-select: none;
  }

  /* ── Single post (keep prose readable inside the wider container) ── */
  .post {
    max-width: 680px;
    margin: 0 auto;
  }

  /* ── Pagination ── */
  .pager {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 24px;
    margin: 32px 0 8px;
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    letter-spacing: .03em;
  }

  .pager-link {
    color: var(--amber);
    transition: color .15s;
  }

  .pager-link:hover { color: var(--amber-hi); }

  .pager-link.disabled {
    color: var(--dim);
    pointer-events: none;
  }

  .pager-info {
    color: var(--muted);
  }

  /* ── Responsive ── */
  @media (max-width: 760px) {
    .container { padding: 36px 20px 60px; }
    .grid-2 { grid-template-columns: 1fr; }
  }
</style>

<div class="container">
  {{ content }}
</div>

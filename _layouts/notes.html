---
layout: default
---

<style>
  /* ── Page shell ── */
  .container {
    max-width: var(--width-content);
    margin: 0 auto;
    padding: 36px 26px 100px;
  }

  .container.wide { max-width: var(--width-article); padding-top: 40px; }

  /* ── Page heading ── */
  .page-title {
    font-family: var(--font-display);
    font-size: var(--text-2xl);
    font-weight: var(--weight-bold);
    letter-spacing: var(--tracking-tight);
    color: var(--accent);
    margin: 0 0 6px;
  }

  .page-lede {
    font-family: var(--font-body);
    font-size: 14px;
    color: var(--muted);
    margin: 0 0 30px;
  }

  /* ── Footer ── */
  footer {
    max-width: var(--width-content);
    margin: 0 auto;
    padding: var(--space-5) 26px 60px;
    border-top: var(--border-width) solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-wrap: wrap;
    gap: var(--space-4);
    text-align: center;
  }

  .footer-text {
    font-family: var(--font-ui);
    font-size: 10px;
    color: var(--dim);
    letter-spacing: var(--tracking-wide);
  }

  .footer-text a {
    color: var(--muted);
    transition: color var(--transition-fast);
  }

  .footer-text a:hover { color: var(--accent); }

  /* ── Section label ── */
  .section-label {
    font-family: var(--font-ui);
    font-size: 10px;
    color: var(--dim);
    letter-spacing: var(--tracking-widest);
    text-transform: uppercase;
    margin: 48px 0 14px;
  }

  .section-label:first-child { margin-top: 0; }

  .section-label a {
    text-transform: lowercase;
    letter-spacing: var(--tracking-wide);
    color: var(--cyan);
    transition: color var(--transition-fast);
  }

  .section-label a:hover { color: var(--cyan-hi); }

  /* ── Rhythm mark ── */
  .rhythm {
    font-family: var(--font-code);
    font-size: 11px;
    color: var(--dim);
    letter-spacing: .2em;
    margin-bottom: 30px;
    user-select: none;
  }

  /* ── Featured card (hero entry) ── */
  .featured-card {
    display: grid;
    grid-template-columns: 1fr 1fr;
    margin-bottom: 28px;
    background: var(--surface);
    border: var(--border-width) solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    transition: border-color var(--transition-fast);
  }

  .featured-card:hover { border-color: var(--accent); }

  .featured-card.no-shot { grid-template-columns: 1fr; }

  .featured-shot {
    background: var(--surface-2);
    min-height: 200px;
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .featured-body {
    padding: var(--space-5);
    display: flex;
    flex-direction: column;
    gap: var(--space-3);
    justify-content: center;
  }

  .featured-body h3 {
    font-family: var(--font-display);
    font-size: 22px;
    font-weight: var(--weight-bold);
    letter-spacing: var(--tracking-tight);
    color: var(--foreground);
    margin: 0;
  }

  .featured-body p {
    font-family: var(--font-body);
    font-size: 14px;
    color: var(--text-2);
    line-height: var(--leading-normal);
    margin: 0;
  }

  /* ── Compact row list ── */
  .row-list { display: flex; flex-direction: column; }

  .row {
    display: flex;
    gap: var(--space-4);
    align-items: center;
    padding: 14px 0;
    border-bottom: var(--border-width) solid var(--border);
  }

  .row-thumb {
    width: 48px;
    height: 48px;
    flex-shrink: 0;
    border-radius: 6px;
    background: var(--surface);
    border: var(--border-width) solid var(--border);
    object-fit: cover;
  }

  .row-main { flex: 1; min-width: 0; }

  .row-main h3 {
    font-family: var(--font-display);
    font-size: 14px;
    font-weight: var(--weight-bold);
    color: var(--foreground);
    margin: 0 0 4px;
    transition: color var(--transition-fast);
  }

  .row:hover .row-main h3 { color: var(--accent); }

  .row-desc {
    font-family: var(--font-body);
    font-size: var(--text-xs);
    color: var(--muted);
    line-height: var(--leading-normal);
    margin: 0 0 6px;
  }

  .row-date {
    font-family: var(--font-code);
    font-size: 11px;
    color: var(--dim);
    flex-shrink: 0;
  }

  /* ── Single post layout (article + TOC rail) ── */
  .post { margin: 0 auto; }

  .post-layout {
    display: grid;
    grid-template-columns: minmax(0, 1fr) var(--toc-w);
    gap: 40px;
    align-items: start;
  }

  .post-content { max-width: 95ch; }

  .post-toc {
    position: sticky;
    top: calc(var(--header-h) + var(--space-4));
    font-family: var(--font-ui);
    font-size: 11.5px;
    max-height: calc(100vh - var(--header-h) - var(--space-6));
    overflow-y: auto;
  }

  .post-toc .toc-title {
    font-size: 10px;
    letter-spacing: var(--tracking-widest);
    text-transform: uppercase;
    color: var(--dim);
    margin-bottom: 10px;
  }

  .post-toc ul { list-style: none; margin: 0; padding: 0; }
  .post-toc ul ul { padding-left: var(--space-3); }

  .post-toc a {
    display: block;
    color: var(--muted);
    padding: 3px 0;
    line-height: var(--leading-normal);
    transition: color var(--transition-fast);
  }

  .post-toc a:hover { color: var(--accent); }

  /* ── Pagination ── */
  .pager {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: var(--space-5);
    margin: var(--space-6) 0 var(--space-2);
    font-family: var(--font-code);
    font-size: 11px;
    letter-spacing: var(--tracking-wide);
  }

  .pager-link {
    color: var(--cyan);
    transition: color var(--transition-fast);
  }

  .pager-link:hover { color: var(--cyan-hi); }

  .pager-link.disabled { color: var(--dim); pointer-events: none; }
  .pager-info { color: var(--muted); }

  /* ── Responsive ── */
  @media (max-width: 900px) {
    .post-layout { grid-template-columns: 1fr; }
    .post-toc { display: none; }
  }

  @media (max-width: 700px) {
    .container, .container.wide { padding: 26px 16px 60px; }
    footer { padding: var(--space-5) 16px 48px; }
    .featured-card { grid-template-columns: 1fr; }
    .featured-shot { min-height: 160px; aspect-ratio: 16 / 9; }
    .row-date { display: none; }
  }
</style>

<div class="container{% if page.layout == 'post' %} wide{% endif %}">
  {{ content }}
</div>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title }}</title>
  {% if page.description %}<meta name="description" content="{{ page.description }}">{% endif %}
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    {% include theme-tokens.html %}
    body { background: var(--bg); color: var(--text); min-height: 100vh; overflow-x: hidden; }
    body::before { content: ''; position: fixed; inset: 0; background-image: linear-gradient(rgba(42,36,32,.05) 1px, transparent 1px), linear-gradient(90deg, rgba(42,36,32,.05) 1px, transparent 1px); background-size: 44px 44px; pointer-events: none; z-index: 0; }
    nav { display: flex; align-items: center; justify-content: space-between; padding: 18px 40px; border-bottom: 1px solid var(--border); background: rgba(237,230,214,.97); backdrop-filter: blur(8px); position: sticky; top: 0; z-index: 100; }
    .logo { display: flex; align-items: center; gap: 9px; font-family: 'Space Mono', monospace; font-size: 14px; color: var(--text); text-decoration: none; }
    .logo-mark { width: 26px; height: 26px; background: var(--amber); border-radius: 5px; display: flex; align-items: center; justify-content: center; font-size: 14px; color: var(--bg); font-weight: 500; flex-shrink: 0; }
    .nav-links { display: flex; gap: 28px; list-style: none; font-size: 13px; color: var(--muted); }
    .nav-links a { color: inherit; text-decoration: none; transition: color .15s; }
    .nav-links a:hover { color: var(--text); }
    .nav-links a.active { color: var(--amber); }
    .nav-cta { font-family: 'Space Mono', monospace; font-size: 11px; padding: 7px 14px; background: transparent; border: 1px solid var(--amber); color: var(--amber); border-radius: 4px; cursor: pointer; letter-spacing: .06em; text-transform: uppercase; transition: background .15s; text-decoration: none; }
    .nav-cta:hover { background: rgba(181,101,74,.1); }
    .breadcrumb { padding: 14px 40px; font-family: 'Space Mono', monospace; font-size: 10px; color: var(--dim); letter-spacing: .04em; border-bottom: 1px solid var(--border); position: relative; z-index: 1; }
    .breadcrumb a { color: inherit; text-decoration: none; transition: color .15s; }
    .breadcrumb a:hover { color: var(--amber); }
    .breadcrumb .sep { margin: 0 8px; opacity: .4; }
    .breadcrumb .current { color: var(--muted); }
    footer { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px; padding: 20px 40px; border-top: 1px solid var(--border); position: relative; z-index: 1; }
    .footer-left, .footer-right { font-family: 'Space Mono', monospace; font-size: 10px; color: var(--dim); letter-spacing: .03em; }
    @media (max-width: 768px) {
      nav { padding: 16px 20px; }
      .nav-links { display: none; }
      .breadcrumb { padding: 12px 20px; }
      footer { padding: 16px 20px; }
    }
  </style>
</head>
<body>
  {% include hindsight-nav.html %}
  {% if page.breadcrumbs %}{% include hindsight-breadcrumb.html %}{% endif %}
{{ content }}
  {% include hindsight-footer.html %}
</body>
</html>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ page.title }}{% if page.title %} | {% endif %}{{ site.title }}</title>
{% if page.description %}<meta name="description" content="{{ page.description }}">{% endif %}
<link rel="icon" type="image/svg+xml" href="/assets/images/site-icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
<script>
  // Apply the persisted theme before first paint to avoid a flash.
  (function () {
    try {
      var m = localStorage.getItem('syncopated-theme');
      if (!m) m = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      if (m === 'dark') document.documentElement.classList.add('dark');
    } catch (e) {}
  })();
</script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  @media (prefers-reduced-motion: no-preference) {
    html { scroll-behavior: smooth; }
  }
  {% include theme-tokens.html %}
  html { color-scheme: light; }
  html.dark { color-scheme: dark; }
  body {
    background: var(--background);
    color: var(--foreground);
    min-height: 100vh;
  }
</style>
<script src="/assets/js/theme.js" defer></script>
